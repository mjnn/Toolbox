services:
  fund_value_em:
    container_name: ${SERVICE_NAME}
    image: ${IMAGE}
    restart: always
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    command:
      - "uvicorn"
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
