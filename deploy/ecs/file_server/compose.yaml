services:
  file_server:
    container_name: ${SERVICE_NAME}
    image: ${IMAGE}
    restart: always
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    volumes:
      - "/home/admin/files:/app/files"
    command:
      - "uvicorn"
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8888"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
