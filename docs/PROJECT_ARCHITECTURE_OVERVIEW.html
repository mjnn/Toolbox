  <script>
    (function () {
      var tips = {
        developer: "当前：开发者视角（显示全部细节，适合实现和排查）。",
        manager: "当前：管理层视角（隐藏细节文本，突出全局结构与治理主线）。",
        ops: "当前：运维视角（高亮后端/数据/文档治理，弱化前端与插件细节）。"
      };
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".view-btn"));
      var tipNode = document.getElementById("viewTip");
      function setView(view) {
        document.body.setAttribute("data-view", view);
        buttons.forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-view-target") === view);
        });
        if (tipNode) tipNode.textContent = tips[view] || "";
      }
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setView(btn.getAttribute("data-view-target") || "developer");
        });
      });
      setView("developer");
    })();
    (function () {
      var stepTips = {
        all: "当前讲解：总览（完整展示）。",
        "1": "步骤1：前端入口与页面容器发起请求，统一进入 API。",
        "2": "步骤2：后端宿主做鉴权、编排与治理逻辑处理。",
        "3": "步骤3：插件层承接业务特性，实现具体工具能力。",
        "4": "步骤4：运行状态和治理事件沉淀到数据与运行时层。",
        "5": "步骤5：文档与交付层固化流程，支持持续开发与运维。"
      };
      var stepButtons = Array.prototype.slice.call(document.querySelectorAll(".step-btn"));
      var stepTargets = Array.prototype.slice.call(document.querySelectorAll(".step-target"));
      var stepTipNode = document.getElementById("stepTip");
      function setStep(step) {
        if (step === "all") {
          document.body.removeAttribute("data-step-mode");
          stepTargets.forEach(function (node) { node.classList.remove("active"); });
        } else {
          document.body.setAttribute("data-step-mode", "on");
          stepTargets.forEach(function (node) {
            node.classList.toggle("active", node.classList.contains("s" + step));
          });
        }
        stepButtons.forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-step") === step);
        });
        if (stepTipNode) stepTipNode.textContent = stepTips[step] || stepTips.all;
      }
      stepButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setStep(btn.getAttribute("data-step") || "all");
        });
      });
      setStep("all");
    })();
  </script>
</body>
</html>
