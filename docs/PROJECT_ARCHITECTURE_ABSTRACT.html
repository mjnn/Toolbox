<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOS 系统运行逻辑架构图（抽象版）</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f6f8fb; color: #1f2937; }
    .wrap { max-width: 1380px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .desc { margin: 0 0 14px; color: #4b5563; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: #374151; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .links a { margin-right: 12px; color: #2563eb; text-decoration: none; }
    svg { width: 100%; height: 980px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; }
    .title { font-size: 15px; font-weight: 700; fill: #111827; }
    .text { font-size: 12px; fill: #1f2937; }
    .sub { font-size: 11px; fill: #4b5563; }
    .tag { font-size: 11px; font-weight: 600; fill: #0f172a; }
    .step-switch { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .step-btn { border: 1px solid #cbd5e1; background: #fff; color: #111827; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .step-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .step-tip { font-size: 12px; color: #4b5563; margin-top: 6px; }
    body[data-step-mode="on"] .step-target { opacity: 0.22; transition: opacity 0.2s ease; }
    body[data-step-mode="on"] .step-target.active { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MOS 系统运行逻辑架构图（抽象版）</h1>
    <p class="desc">这张图不强调具体代码文件，重点说明系统如何运行、各解耦部分各自负责什么，以及请求/治理/发布三条主闭环。</p>

    <div class="card legend">
      <span><i class="dot" style="background:#dbeafe"></i>交互与入口层</span>
      <span><i class="dot" style="background:#dcfce7"></i>宿主治理层</span>
      <span><i class="dot" style="background:#fef9c3"></i>插件能力层</span>
      <span><i class="dot" style="background:#fee2e2"></i>状态与数据层</span>
      <span><i class="dot" style="background:#ede9fe"></i>交付与运维层</span>
    </div>

    <div class="card links">
      <a href="./README.md">文档入口 README</a>
      <a href="./PROJECT_ARCHITECTURE_OVERVIEW.html">总体架构图（全面版）</a>
      <a href="./AGENT_CONTINUOUS_DELIVERY_AND_OPS_GUIDE.md">持续开发与运维指南</a>
      <a href="./DOCS_SYSTEM_AND_GOVERNANCE.md">文档治理规范</a>
    </div>
    <div class="card">
      <div class="step-switch">
        <button type="button" class="step-btn active" data-step="all">总览</button>
        <button type="button" class="step-btn" data-step="1">步骤1 入口与请求</button>
        <button type="button" class="step-btn" data-step="2">步骤2 宿主治理</button>
        <button type="button" class="step-btn" data-step="3">步骤3 插件执行</button>
        <button type="button" class="step-btn" data-step="4">步骤4 数据沉淀</button>
        <button type="button" class="step-btn" data-step="5">步骤5 交付运维</button>
      </div>
      <div class="step-tip" id="stepTip">当前：总览（完整展示）。</div>
    </div>

    <svg viewBox="0 0 1380 980" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <polygon points="0,0 10,4 0,8" fill="#6b7280"></polygon>
        </marker>
      </defs>

      <!-- L1 交互层 -->
      <rect class="step-target s1" x="20" y="20" width="1340" height="150" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="40" y="48" class="title">L1 交互与入口层（What users touch）</text>
      <rect x="40" y="62" width="300" height="92" rx="8" fill="#fff" stroke="#93c5fd"/>
      <text x="54" y="86" class="text">终端用户入口（工具使用）</text>
      <text x="54" y="104" class="sub">负责发起业务请求，触发工具能力</text>
      <text x="54" y="122" class="sub">只关心“能否用、好不好用”</text>
      <rect x="360" y="62" width="300" height="92" rx="8" fill="#fff" stroke="#93c5fd"/>
      <text x="374" y="86" class="text">管理员入口（治理控制台）</text>
      <text x="374" y="104" class="sub">负责审批、配置、审计、发布协调</text>
      <text x="374" y="122" class="sub">不直接承载业务实现</text>
      <rect x="680" y="62" width="300" height="92" rx="8" fill="#fff" stroke="#93c5fd"/>
      <text x="694" y="86" class="text">Agent / 开发者入口</text>
      <text x="694" y="104" class="sub">通过规范化流程持续开发与集成</text>
      <text x="694" y="122" class="sub">小步迭代、可验证、可回滚</text>
      <rect x="1000" y="62" width="340" height="92" rx="8" fill="#fff" stroke="#93c5fd"/>
      <text x="1014" y="86" class="text">统一 API 门面</text>
      <text x="1014" y="104" class="sub">把前端请求引导到宿主治理与插件能力</text>
      <text x="1014" y="122" class="sub">屏蔽内部模块演进细节</text>

      <!-- L2 宿主治理层 -->
      <rect class="step-target s2" x="20" y="190" width="1340" height="240" rx="10" fill="#dcfce7" stroke="#86efac"/>
      <text x="40" y="218" class="title">L2 宿主治理层（Host governance, decoupled from business details）</text>
      <rect x="40" y="232" width="255" height="180" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="54" y="256" class="text">认证与授权门禁</text>
      <text x="54" y="274" class="sub">身份识别、角色判定、访问许可</text>
      <text x="54" y="292" class="sub">职责：只做门禁，不做业务逻辑</text>

      <rect x="315" y="232" width="255" height="180" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="329" y="256" class="text">工具目录与路由编排</text>
      <text x="329" y="274" class="sub">工具注册、入口聚合、能力编排</text>
      <text x="329" y="292" class="sub">职责：把请求分发到正确能力单元</text>

      <rect x="590" y="232" width="255" height="180" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="604" y="256" class="text">治理域服务</text>
      <text x="604" y="274" class="sub">审批、审计、反馈、通知、版本治理</text>
      <text x="604" y="292" class="sub">职责：形成管理闭环与追溯链路</text>

      <rect x="865" y="232" width="235" height="180" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="879" y="256" class="text">公共策略与复用能力</text>
      <text x="879" y="274" class="sub">分页、错误处理、可见性策略</text>
      <text x="879" y="292" class="sub">职责：统一行为，降低重复实现</text>

      <rect x="1120" y="232" width="220" height="180" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="1134" y="256" class="text">对外稳定契约</text>
      <text x="1134" y="274" class="sub">保持 API 语义稳定</text>
      <text x="1134" y="292" class="sub">支持内部模块替换与重构</text>

      <!-- L3 插件能力层 -->
      <rect class="step-target s3" x="20" y="450" width="1340" height="165" rx="10" fill="#fef9c3" stroke="#fde047"/>
      <text x="40" y="478" class="title">L3 插件能力层（Business capabilities, independent evolution）</text>
      <rect x="40" y="492" width="430" height="105" rx="8" fill="#fff" stroke="#fde047"/>
      <text x="54" y="516" class="text">业务能力插件 A/B/C ...</text>
      <text x="54" y="534" class="sub">每个插件独立实现业务规则与特性 API</text>
      <text x="54" y="552" class="sub">职责：快速交付业务价值，不污染宿主治理</text>
      <rect x="490" y="492" width="420" height="105" rx="8" fill="#fff" stroke="#fde047"/>
      <text x="504" y="516" class="text">插件契约与边界约束</text>
      <text x="504" y="534" class="sub">清单/Schema/行为目录同源，防止漂移</text>
      <text x="504" y="552" class="sub">职责：保证可接入、可观测、可治理</text>
      <rect x="930" y="492" width="410" height="105" rx="8" fill="#fff" stroke="#fde047"/>
      <text x="944" y="516" class="text">插件与宿主关系</text>
      <text x="944" y="534" class="sub">插件专注“业务”，宿主专注“门禁+治理”</text>
      <text x="944" y="552" class="sub">形成低耦合高内聚</text>

      <!-- L4 数据层 -->
      <rect class="step-target s4" x="20" y="635" width="1340" height="150" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="40" y="663" class="title">L4 状态与数据层（State, persistence, observability）</text>
      <rect x="40" y="677" width="430" height="92" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="54" y="701" class="text">业务状态存储</text>
      <text x="54" y="719" class="sub">用户、角色、工具、权限、发布记录</text>
      <text x="54" y="737" class="sub">职责：承载系统事实状态</text>
      <rect x="490" y="677" width="420" height="92" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="504" y="701" class="text">治理与观测数据</text>
      <text x="504" y="719" class="sub">访问日志、反馈、通知、审计事件</text>
      <text x="504" y="737" class="sub">职责：支持追溯、优化与合规</text>
      <rect x="930" y="677" width="410" height="92" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="944" y="701" class="text">运行配置状态</text>
      <text x="944" y="719" class="sub">环境配置、可见性策略、性能参数</text>
      <text x="944" y="737" class="sub">职责：控制运行行为与发布形态</text>

      <!-- L5 交付层 -->
      <rect class="step-target s5" x="20" y="805" width="1340" height="160" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="40" y="833" class="title">L5 交付与运维层（Delivery, operation, governance documents）</text>
      <rect x="40" y="847" width="430" height="102" rx="8" fill="#fff" stroke="#c4b5fd"/>
      <text x="54" y="871" class="text">持续开发与集成流程</text>
      <text x="54" y="889" class="sub">规范驱动 -> 实现 -> 校验 -> 发布</text>
      <text x="54" y="907" class="sub">职责：把变化稳定地交付到运行环境</text>
      <rect x="490" y="847" width="420" height="102" rx="8" fill="#fff" stroke="#c4b5fd"/>
      <text x="504" y="871" class="text">部署形态与运行手册</text>
      <text x="504" y="889" class="sub">开发 / 便携包 / ECS 容器</text>
      <text x="504" y="907" class="sub">职责：根据环境选择一致的落地路径</text>
      <rect x="930" y="847" width="410" height="102" rx="8" fill="#fff" stroke="#c4b5fd"/>
      <text x="944" y="871" class="text">文档治理与协作规则</text>
      <text x="944" y="889" class="sub">统一入口、分层治理、冲突仲裁顺序</text>
      <text x="944" y="907" class="sub">职责：保证知识与系统同步演进</text>

      <!-- flow labels -->
      <rect class="step-target s1" x="1070" y="180" width="250" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1082" y="199" class="tag step-target s1">主流程 1：请求执行闭环</text>
      <rect class="step-target s2 s3 s4" x="1070" y="440" width="250" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1082" y="459" class="tag step-target s2 s3 s4">主流程 2：治理反馈闭环</text>
      <rect class="step-target s5" x="1070" y="796" width="250" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1082" y="815" class="tag step-target s5">主流程 3：发布运维闭环</text>

      <!-- arrows -->
      <line class="step-target s1 s2" x1="690" y1="170" x2="690" y2="190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s2 s3" x1="690" y1="430" x2="690" y2="450" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s3 s4" x1="690" y1="615" x2="690" y2="635" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s4 s5" x1="690" y1="785" x2="690" y2="805" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

      <line class="step-target s3 s4" x1="170" y1="585" x2="170" y2="670" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s4 s5" x1="370" y1="730" x2="370" y2="847" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s4 s5" x1="1090" y1="730" x2="1090" y2="847" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <line class="step-target s5 s2" x1="1210" y1="898" x2="1210" y2="232" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    </svg>
  </div>
  <script>
    (function () {
      var stepTips = {
        all: "当前：总览（完整展示）。",
        "1": "步骤1：从用户/管理员/Agent 入口发起请求，统一 API 门面承接流量。",
        "2": "步骤2：宿主治理层执行鉴权、编排、治理策略，决定请求去向与治理动作。",
        "3": "步骤3：插件能力层处理具体业务能力，保持与宿主解耦。",
        "4": "步骤4：运行状态、治理事件与配置沉淀到数据层，形成可追溯基础。",
        "5": "步骤5：通过交付运维层完成发布、运行保障和文档化，结果反馈回治理层。"
      };
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".step-btn"));
      var targets = Array.prototype.slice.call(document.querySelectorAll(".step-target"));
      var tip = document.getElementById("stepTip");
      function activate(step) {
        if (step === "all") {
          document.body.removeAttribute("data-step-mode");
          targets.forEach(function (node) { node.classList.remove("active"); });
        } else {
          document.body.setAttribute("data-step-mode", "on");
          targets.forEach(function (node) {
            node.classList.toggle("active", node.classList.contains("s" + step));
          });
        }
        buttons.forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-step") === step);
        });
        if (tip) tip.textContent = stepTips[step] || stepTips.all;
      }
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          activate(btn.getAttribute("data-step") || "all");
        });
      });
      activate("all");
    })();
  </script>
</body>
</html>
